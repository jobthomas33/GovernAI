services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://governai:governai@postgres:5432/governai
      APP_ENV: docker
      APP_NAME: GovernAI
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: governai
      POSTGRES_USER: governai
      POSTGRES_PASSWORD: governai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governai -d governai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
